<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Fact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/BlackrockDigital/startbootstrap-sb-admin-2@master/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-6 col-md-6">
        <div class="card o-hidden border-0 shadow-lg my-5">
          <div class="card-body p-5">
            <div class="text-center">
              <h1 class="h4 text-gray-900 mb-4">Iniciar Sesión</h1>
            </div>
            <form id="loginForm">
              <div class="form-group">
                <input type="text" class="form-control form-control-user" id="login" placeholder="Login" required>
              </div>
              <div class="form-group">
                <input type="password" class="form-control form-control-user" id="clave" placeholder="Contraseña" required>
              </div>
              <button type="submit" class="btn btn-primary btn-user btn-block">Ingresar</button>
              <div class="text-center mt-3 text-danger" id="mensajeError"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const datos = {
        login: document.getElementById('login').value,
        clave: document.getElementById('clave').value
      };

      const res = await fetch('LoginServlet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });

      if (res.status === 200) {
        window.location.href = 'principal.html';
      } else {
        const data = await res.json();
        document.getElementById('mensajeError').textContent = data.mensaje || 'Error en login';
      }
    });
  </script>

</body>
</html>
