<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login - Fact</title>
        <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
        <link href="css/sb-admin-2.min.css" rel="stylesheet">
    </head>
    <body class="bg-gradient-primary">

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card o-hidden border-0 shadow-lg my-5">
                        <div class="card-body p-5">
                            <h1 class="h4 text-gray-900 mb-4 text-center">Iniciar Sesión</h1>
                            <form action="LoginServlet" method="post">
                                <div class="form-group">
                                    <input type="text" class="form-control form-control-user" name="login" placeholder="Login" required>
                                </div>
                                <div class="form-group">
                                    <input type="password" class="form-control form-control-user" name="clave" placeholder="Contraseña" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">Ingresar</button>
                            </form>
                            <div class="text-center mt-2">
                                <small class="text-danger">
                                    <%= request.getParameter("error") != null ? "Usuario o clave incorrectos" : "" %>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
