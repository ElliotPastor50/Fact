<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Cambiar Clave</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/gh/BlackrockDigital/startbootstrap-sb-admin-2@master/css/sb-admin-2.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2>Cambiar Clave</h2>
            <form id="formClave">
                <div class="form-group"><input type="password" id="actual" class="form-control" placeholder="Clave actual" required></div>
                <div class="form-group"><input type="password" id="nueva" class="form-control" placeholder="Nueva clave" required></div>
                <div class="form-group"><input type="password" id="confirma" class="form-control" placeholder="Confirmar clave" required></div>
                <button type="submit" class="btn btn-success">Actualizar</button>
            </form>
        </div>

        <script>
            document.getElementById('formClave').addEventListener('submit', async function (e) {
                e.preventDefault();

                const datos = {
                    actual: document.getElementById('actual').value,
                    nueva: document.getElementById('nueva').value,
                    confirma: document.getElementById('confirma').value
                };

                const res = await fetch('CambiarClaveServlet', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(datos)
                });

                const respuesta = await res.json();
                alert(respuesta.mensaje);
            });
        </script>
    </body>
</html>
