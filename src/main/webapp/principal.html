<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/BlackrockDigital/startbootstrap-sb-admin-2@master/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2>Mantenimiento Cliente</h2>
    <form id="formCliente">
      <div class="form-group"><input type="text" id="ndni" class="form-control" placeholder="DNI" required></div>
      <div class="form-group"><input type="text" id="appa" class="form-control" placeholder="Apellido Paterno" required></div>
      <div class="form-group"><input type="text" id="apma" class="form-control" placeholder="Apellido Materno" required></div>
      <div class="form-group"><input type="text" id="nomb" class="form-control" placeholder="Nombres" required></div>
      <div class="form-group"><input type="date" id="fecha" class="form-control" required></div>
      <div class="form-group"><input type="text" id="login" class="form-control" placeholder="Login" required></div>
      <button type="submit" class="btn btn-primary">Agregar Cliente</button>
    </form>
  </div>

  <script>
    document.getElementById('formCliente').addEventListener('submit', async function (e) {
      e.preventDefault();

      const cliente = {
        ndniClie: document.getElementById('ndni').value,
        appaClie: document.getElementById('appa').value,
        apmaClie: document.getElementById('apma').value,
        nombClie: document.getElementById('nomb').value,
        fechNaciClie: document.getElementById('fecha').value,
        logiClie: document.getElementById('login').value
      };

      const res = await fetch('ClienteServlet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cliente)
      });

      if (res.ok) {
        alert('Cliente registrado');
        document.getElementById('formCliente').reset();
      } else {
        alert('Error al registrar cliente');
      }
    });
  </script>
</body>
</html>
